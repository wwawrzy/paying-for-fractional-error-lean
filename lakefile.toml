name = "ShortLean"
version = "0.1.0"
defaultTargets = ["PaperIndex", "verification"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.29.0"

[[lean_lib]]
name = "GraphTheory"

[[lean_lib]]
name = "Paper"

[[lean_lib]]
name = "verification"
roots = ["verification.Proposition2Planar", "verification.Audit", "verification.FullAudit", "verification.DIntegrationAudit"]

[[lean_lib]]
name = "PaperIndex"
